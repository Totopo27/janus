[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-s2st"
version = "0.1.0"
description = "Local-First On-Device Speech-to-Speech Translation and Live Annotation Teleprompter"
authors = [{ name = "Luis G. Araya A." }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "sherpa-onnx>=1.10.0",
    "supertonic>=1.3.1",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "av>=14.0.0,<17.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
